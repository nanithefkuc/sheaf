name: CI

on:
  push:
    pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries
        run: cargo build --release --workspace --bins
      - name: Performance gate
        run: python3 scripts/perf_gate.py

  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build workspace binaries
        run: cargo build --workspace --bins
      - name: Install extension dependencies
        run: npm ci --prefix editors/vscode
      - name: Type-check the extension
        run: npm --prefix editors/vscode run check
      - name: Extension unit tests
        run: npm --prefix editors/vscode run test:unit
      - name: Extension-host end-to-end
        run: xvfb-run -a ./scripts/e2e_vscode.sh
